<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青岛公交网络可视化</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#1a1a2e;color:#eee}
#header{background:linear-gradient(135deg,#16213e,#0f3460);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
#header h1{font-size:16px}
.tab-btn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;background:#2a2a4a;color:#aaa;transition:all .15s}
.tab-btn.active,.tab-btn:hover{background:#e94560;color:#fff}
#controls{display:flex;gap:4px;align-items:center}
#controls span{font-size:11px;color:#999}
.count-btn{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;background:#2a2a4a;color:#aaa;transition:all .15s}
.count-btn:active{background:#e94560;color:#fff}
#line-count{width:55px;padding:4px 6px;border:none;border-radius:4px;font-size:11px;background:#fff;color:#333;outline:none;text-align:center}
#search-box{position:relative;display:flex;gap:4px;align-items:center}
#search-input{padding:5px 10px;border:none;border-radius:4px;width:200px;font-size:12px;background:#fff;color:#333;outline:none}
#search-btn{padding:5px 10px;border:none;border-radius:4px;background:#e94560;color:#fff;font-size:12px;font-weight:bold;cursor:pointer}
#suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:0 0 4px 4px;max-height:160px;overflow-y:auto;display:none;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.suggestion-item{padding:5px 10px;cursor:pointer;color:#333;font-size:12px;border-bottom:1px solid #eee}
.suggestion-item:hover{background:#e94560;color:#fff}
.suggestion-item .type{color:#999;font-size:10px;margin-left:6px}
.suggestion-item:hover .type{color:#fcc}
#map-container{width:100%;height:calc(100vh - 56px);position:relative}
#map{width:100%;height:100%}
#info-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:16px;font-size:12px;display:none;white-space:nowrap;z-index:10;pointer-events:none}
#status{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:4px 12px;border-radius:10px;font-size:11px;display:none;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="header">
  <h1>青岛公交网络可视化</h1>
  <div style="display:flex;gap:4px">
    <button class="tab-btn active" data-tab="stations">站点分布</button>
    <button class="tab-btn" data-tab="routes">线路轨迹</button>
    <button class="tab-btn" data-tab="overview">路网全图</button>
  </div>
  <div id="controls">
    <span>线路:</span>
    <button class="count-btn" data-n="20">20</button>
    <button class="count-btn" data-n="50">50</button>
    <button class="count-btn" data-n="100">100</button>
    <button class="count-btn" data-n="200">200</button>
    <input id="line-count" type="number" value="20" min="1">
    <button class="count-btn" data-n="9999">全部</button>
  </div>
  <div id="search-box">
    <input id="search-input" type="text" placeholder="搜站点/线路">
    <div id="suggestions"></div>
    <button id="search-btn">搜索</button>
  </div>
</div>
<div id="map-container"><div id="map"></div><div id="status"></div><div id="info-bar"></div></div>

<script>
(function(){
if (typeof STOPS === 'undefined' || typeof LINES === 'undefined') {
    document.getElementById('map').innerHTML = '<div style="color:#fff;text-align:center;padding-top:200px;font-size:18px">数据加载失败<br><small>请确保 data.js 在同目录下</small></div>';
    return;
}

var AMAP = {version:8,sources:{"amap":{type:"raster",tiles:["https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}"],tileSize:256,attribution:"©高德"}},layers:[{id:"al",type:"raster",source:"amap",minzoom:0,maxzoom:18}]};
var currentTab = 'stations', currentCount = 20, building = false;
var searchIdx = [];
STOPS.forEach(function(s,i){searchIdx.push({t:'stop',n:s.name,i:i})});
LINES.forEach(function(l,i){searchIdx.push({t:'line',n:l.shortName,f:l.fullName,i:i})});

function status(msg){var s=document.getElementById('status');s.textContent=msg;s.style.display='block';if(msg==='')s.style.display='none'}
setTimeout(function(){status('')},1);

function showTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
    applyVis();
}

function applyVis() {
    var N = currentCount;
    var total = 1 + 3*N;
    var vis = new Array(total).fill(false);
    if (currentTab === 'stations') vis[0] = true;
    else if (currentTab === 'routes') { for (var i=1; i<1+2*N; i++) vis[i]=true; }
    else if (currentTab === 'overview') { for (var i=1+2*N; i<total; i++) vis[i]=true; }
    Plotly.restyle('map','visible',vis);
}

function rebuild(n) {
    if (building) return;
    building = true;
    n = Math.max(1, Math.min(n, LINES.length));
    currentCount = n;
    document.getElementById('line-count').value = n;
    status('正在加载 '+n+' 条线路...');

    var traces = [];
    // Station points
    var sl=[],sn=[],st=[];
    STOPS.forEach(function(s){sl.push(s.lat);sn.push(s.lon);st.push(s.name)});
    traces.push({type:'scattermap',lon:sn,lat:sl,mode:'markers',marker:{size:5,color:'#FF4500',opacity:0.7},text:st,hoverinfo:'text',showlegend:false,visible:currentTab==='stations'});
    var visMode = currentTab;
    // Route lines
    for (var i=0;i<n;i++){
        var l=LINES[i],la=[],lo=[];
        l.coords.forEach(function(c){la.push(c[0]);lo.push(c[1])});
        traces.push({type:'scattermap',lon:lo,lat:la,mode:'lines',line:{width:2.5,color:l.color},hovertext:l.shortName,hoverinfo:'text',showlegend:false,visible:visMode==='routes'});
    }
    // Route markers
    for (var i=0;i<n;i++){
        var l=LINES[i],m=Math.floor(l.coords.length/2);
        traces.push({type:'scattermap',lon:[l.coords[m][1]],lat:[l.coords[m][0]],mode:'markers',marker:{size:14,color:l.color,opacity:0.9},hovertext:l.shortName,hoverinfo:'text',showlegend:false,visible:visMode==='routes'});
    }
    // Overview
    for (var i=0;i<n;i++){
        var l=LINES[i],la=[],lo=[];
        l.coords.forEach(function(c){la.push(c[0]);lo.push(c[1])});
        traces.push({type:'scattermap',lon:lo,lat:la,mode:'lines',line:{width:1.5,color:'red'},opacity:0.4,hoverinfo:'skip',showlegend:false,visible:visMode==='overview'});
    }

    Plotly.react('map',traces,{map:{style:AMAP,center:CENTER,zoom:10},height:window.innerHeight-56,margin:{r:0,t:0,l:0,b:0}},{responsive:true,displayModeBar:false}).then(function(){
        building = false;
        status('');
    }).catch(function(){
        building = false;
        status('');
    });
}

// Buttons
document.querySelectorAll('.tab-btn').forEach(function(b){b.onclick=function(){showTab(this.dataset.tab)}});
document.querySelectorAll('.count-btn').forEach(function(b){b.onclick=function(){rebuild(parseInt(this.dataset.n))}});
document.getElementById('line-count').onchange=function(){rebuild(parseInt(this.value)||20)};
document.getElementById('search-btn').onclick=doSearch;
document.getElementById('search-input').oninput=onInput;
document.getElementById('search-input').onkeydown=function(e){if(e.key==='Enter')doSearch()};

// Search
function onInput(){
    var q=document.getElementById('search-input').value.trim();
    var sug=document.getElementById('suggestions');
    if(q.length<1){sug.style.display='none';return}
    var m=searchIdx.filter(function(x){return x.n.indexOf(q)!==-1||(x.f&&x.f.indexOf(q)!==-1)}).slice(0,8);
    if(m.length===0){sug.style.display='none';return}
    sug.innerHTML=m.map(function(x){return '<div class="suggestion-item" data-t="'+x.t+'" data-i="'+x.i+'">'+x.n+'<span class="type">['+(x.t==='stop'?'站点':'线路')+']</span></div>'}).join('');
    sug.style.display='block';
    sug.querySelectorAll('.suggestion-item').forEach(function(el){el.onclick=function(){sug.style.display='none';if(this.dataset.t==='stop')goStop(parseInt(this.dataset.i));else goLine(parseInt(this.dataset.i))}});
}

function doSearch(){
    var q=document.getElementById('search-input').value.trim();
    document.getElementById('suggestions').style.display='none';
    if(!q)return;
    for(var i=0;i<searchIdx.length;i++){if(searchIdx[i].n===q||searchIdx[i].f===q){if(searchIdx[i].t==='stop')goStop(searchIdx[i].i);else goLine(searchIdx[i].i);return}}
    for(var i=0;i<searchIdx.length;i++){if(searchIdx[i].n.indexOf(q)!==-1){if(searchIdx[i].t==='stop')goStop(searchIdx[i].i);else goLine(searchIdx[i].i);return}}
    alert('未找到: '+q);
}

function goStop(i){
    var s=STOPS[i]; showTab('stations');
    document.getElementById('search-input').value=s.name;
    Plotly.relayout('map',{'map.center':{lat:s.lat,lon:s.lon},'map.zoom':16});
    var b=document.getElementById('info-bar');b.innerHTML='<b>站点:</b> '+s.name;b.style.display='block';
    setTimeout(function(){b.style.display='none'},4000);
}

function goLine(i){
    // Auto expand if line not visible
    if(i>=currentCount) rebuild(Math.max(currentCount,i+20));
    showTab('routes');
    var l=LINES[i];
    document.getElementById('search-input').value=l.shortName;
    var b=document.getElementById('info-bar');b.innerHTML='<b>线路:</b> '+l.fullName;b.style.display='block';
    setTimeout(function(){b.style.display='none'},4000);
}

document.addEventListener('click',function(e){if(e.target!==document.getElementById('search-input'))document.getElementById('suggestions').style.display='none'});
window.onresize=function(){Plotly.relayout('map',{height:window.innerHeight-56})};

// Init
rebuild(20);
})();
</script>
</body>
</html>
